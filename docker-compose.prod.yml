# ============================================================
# Aprender IA — produção
#
# Uma única porta externa (DEPLOY_PORT) publicada no host.
# O nginx interno roteia para:
#   web:3000  → aplicação Next.js (páginas e API routes)
#   api:3001  → serviço de API dedicado (reservado)
#
# O nome do projeto é fixo de propósito: sem ele o Compose usa o nome
# do diretório, que muda a cada release, e cada deploy tentaria criar
# containers novos com nomes já em uso.
# ============================================================

name: aprenderia

services:
  postgres:
    image: postgres:16-alpine
    container_name: aprenderia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [interna]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: aprenderia-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${CANONICAL_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      PUBLIC_APP_URL: ${CANONICAL_URL}
      # Recuperação de senha. Sem SMTP o link vai para o log do container.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Notificações push. O par VAPID é criado uma vez pelo deploy e
      # preservado entre releases: trocar a chave pública invalida todas
      # as inscrições já feitas nos aparelhos dos alunos.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Protege a rota interna acordada pelo cron diário da VPS.
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  # Executa o reengajamento dentro da própria rede Docker. A rota continua
  # protegida por CRON_SECRET e aplica preferências, horários e limites na
  # própria aplicação; este serviço só agenda a execução.
  scheduler:
    image: curlimages/curl:8.12.1
    container_name: aprenderia-scheduler
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      ENGAGEMENT_INTERVAL_SECONDS: ${ENGAGEMENT_INTERVAL_SECONDS:-3600}
    depends_on:
      - web
    command:
      - /bin/sh
      - -ec
      - |
        if [ -z "$${CRON_SECRET}" ]; then
          echo "CRON_SECRET ausente; agendador de engajamento desativado."
          exec tail -f /dev/null
        fi
        while true; do
          curl --fail --silent --show-error --max-time 60 \
            -X POST -H "Authorization: Bearer $${CRON_SECRET}" \
            http://web:3000/api/engajamento || true
          sleep "$${ENGAGEMENT_INTERVAL_SECONDS}"
        done
    networks: [interna]

  nginx:
    image: nginx:1.27-alpine
    container_name: aprenderia-nginx
    restart: unless-stopped
    ports:
      # Única porta exposta ao host — o nginx do host faz proxy para cá
      - "127.0.0.1:${DEPLOY_PORT}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks: [interna]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
    name: aprenderia_postgres_data

networks:
  interna:
    name: aprenderia_interna
