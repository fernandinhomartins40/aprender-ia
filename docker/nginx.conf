# ============================================================
# Aprender IA — nginx interno do compose
#
# Recebe todo o tráfego da porta externa única e roteia
# internamente entre os dois serviços:
#   /api/backend/*  → api:3001   (serviço dedicado, reservado)
#   /*              → web:3000   (Next.js: páginas + API routes)
# ============================================================

upstream app_web {
    server web:3000;
    keepalive 32;
}

# O serviço de API dedicado ainda não existe. Um bloco `upstream` com
# nome inexistente faz o nginx ABORTAR no boot ("host not found in
# upstream"), então resolvemos o nome em tempo de requisição usando o
# DNS interno do Docker e uma variável — assim o container sobe mesmo
# sem o serviço api, e a rota devolve 503 até ele existir.

server {
    listen 80;
    server_name _;

    # PWA e uploads de material didático
    client_max_body_size 25m;

    # Compressão — importante para quem acessa por 3G na escola
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check do próprio nginx (não depende do app)
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "nginx ok\n";
    }

    # ---- Assets estáticos do Next: cache longo ----
    location /_next/static/ {
        proxy_pass http://app_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Service worker: nunca cachear ----
    # Um sw.js cacheado prende o usuário numa versão antiga do PWA.
    location = /sw.js {
        proxy_pass http://app_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- Serviço de API dedicado (reservado) ----
    location /api/backend/ {
        # DNS embutido do Docker; a variável adia a resolução do nome
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api "api:3001";

        proxy_pass http://$upstream_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;

        # Enquanto o serviço api não sobe, responde 503 em vez de 502
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_indisponivel;
    }

    location @api_indisponivel {
        default_type application/json;
        return 503 '{"erro":"servico_indisponivel","mensagem":"O serviço de API ainda não está ativo."}';
    }

    # ---- Aplicação Next.js ----
    location / {
        proxy_pass http://app_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserva o esquema original vindo do nginx do host,
        # senão o Auth.js monta callbacks em http:// e o login quebra.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400;
    }
}
