services:
  postgres:
    image: postgres:16-alpine
    container_name: aprender-ia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aprender
      POSTGRES_PASSWORD: aprender_dev
      POSTGRES_DB: aprender_ia
    ports:
      - "5544:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aprender -d aprender_ia"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: aprender-ia-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
